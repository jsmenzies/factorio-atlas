<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0c0a09" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!-- Before the page draws, as cached pages are the same for everyone: the visitor's rate unit
		     (lib/rate-unit.svelte.ts; pages carry both units), and whether a session may exist
		     (lib/server/auth/sessions.ts: the hint cookie; AccountLink.svelte asks /me for the name). -->
		<script nonce="%sveltekit.nonce%">
			try {
				if (localStorage.getItem('atlas.rate') === 'min') document.documentElement.dataset.rate = 'min';
			} catch {}
			if (/(?:^|; )atlas_signed_in=1(?:;|$)/.test(document.cookie)) document.documentElement.dataset.auth = 'in';
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
